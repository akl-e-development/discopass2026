<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiscoPass — Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Syne:wght@400;500;600&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #060608; --s1: #0f0f14; --s2: #17171f; --s3: #1f1f2a;
  --lime: #d4ff00; --pink: #ff2d6b; --white: #f5f5f0;
  --muted: #5a5a6e; --muted2: #8888a0; --success: #00e5a0;
}
html, body { height: 100%; }
body {
  font-family: 'Syne', sans-serif;
  background: var(--bg); color: var(--white);
  min-height: 100vh; overflow: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(212,255,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,255,0,0.03) 1px, transparent 1px);
  background-size: 48px 48px; pointer-events: none; z-index: 0;
}

/* ── SCREENS ── */
.screen {
  display: none; position: relative; z-index: 1;
  width: 100%; min-height: 100vh;
  flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 24px; text-align: center;
}
.screen.active { display: flex; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.fadein { animation: fadeUp 0.3s ease both; }
@keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
.popin { animation: popIn 0.4s cubic-bezier(0.34, 1.4, 0.64, 1) both; }

/* ── WORDMARK ── */
.wordmark {
  font-family: 'Unbounded', sans-serif; font-weight: 900;
  font-size: 12px; letter-spacing: 6px; color: var(--lime);
  position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
  white-space: nowrap;
}
.wordmark span { color: var(--pink); }

/* ── READY SCREEN ── */
.ready-icon {
  width: 80px; height: 80px; border-radius: 50%;
  background: rgba(212,255,0,0.08); border: 1px solid rgba(212,255,0,0.2);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 24px;
}
.ready-title {
  font-family: 'Unbounded', sans-serif; font-weight: 700;
  font-size: 26px; letter-spacing: -0.5px; margin-bottom: 10px;
}
.ready-sub { font-size: 14px; color: var(--muted2); line-height: 1.6; margin-bottom: 36px; max-width: 320px; }

/* ── BUTTONS ── */
.btn {
  padding: 16px 36px; border-radius: 50px; border: none;
  font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 2px; cursor: pointer; text-transform: uppercase;
  transition: transform 0.15s, box-shadow 0.2s;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn-lime { background: var(--lime); color: #000; }
.btn-lime:hover { box-shadow: 0 8px 28px rgba(212,255,0,0.3); }
.btn-outline { background: transparent; color: var(--white); border: 1px solid var(--s3); }
.btn-outline:hover { border-color: var(--muted); }

/* ── SCANNER SCREEN ── */
#s-scan { padding: 0; justify-content: flex-start; }

.scan-header {
  width: 100%; padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--s3);
  background: rgba(6,6,8,0.95); backdrop-filter: blur(12px);
  position: relative; z-index: 10; flex-shrink: 0;
}
.scan-header-title {
  font-family: 'Unbounded', sans-serif; font-size: 10px;
  letter-spacing: 2.5px; color: var(--lime); text-transform: uppercase;
}
.stop-btn {
  font-family: 'Unbounded', sans-serif; font-size: 8px; letter-spacing: 2px;
  background: transparent; border: 1px solid var(--s3); color: var(--muted2);
  padding: 8px 14px; border-radius: 40px; cursor: pointer; transition: all 0.2s;
  text-transform: uppercase;
}
.stop-btn:hover { color: var(--white); border-color: var(--muted); }

.camera-area {
  flex: 1; width: 100%; position: relative;
  background: #000; display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
#cam-video {
  width: 100%; height: 100%; object-fit: cover;
  position: absolute; inset: 0;
}
.finder-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.finder {
  width: min(70vw, 260px); height: min(70vw, 260px);
  position: relative;
  box-shadow: 0 0 0 9999px rgba(6,6,8,0.55);
}
.finder::before, .finder::after,
.finder .c::before, .finder .c::after {
  content: ''; position: absolute; width: 28px; height: 28px;
  border-color: var(--lime); border-style: solid;
}
.finder::before  { top: 0;    left: 0;   border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
.finder::after   { top: 0;    right: 0;  border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
.finder .c::before { bottom: 0; left: 0;   border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
.finder .c::after  { bottom: 0; right: 0;  border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }
.scan-line {
  position: absolute; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--lime), transparent);
  animation: scanMove 2s ease-in-out infinite; top: 0;
}
@keyframes scanMove { 0% { top: 5%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 95%; opacity: 0; } }

.scan-hint {
  position: absolute; bottom: 24px; left: 0; right: 0;
  text-align: center; font-size: 12px; color: rgba(255,255,255,0.5);
  font-family: 'Unbounded', sans-serif; letter-spacing: 1.5px; text-transform: uppercase;
}

/* ── RESULT SCREEN ── */
#s-result { position: fixed; inset: 0; background: var(--bg); z-index: 100; }

.result-bg-ok  { background: radial-gradient(ellipse at 50% 0%, rgba(0,229,160,0.12) 0%, transparent 60%); }
.result-bg-bad { background: radial-gradient(ellipse at 50% 0%, rgba(255,45,107,0.12) 0%, transparent 60%); }

.result-icon {
  width: 100px; height: 100px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 28px; position: relative;
}
.result-icon svg.ring {
  position: absolute; inset: 0; width: 100%; height: 100%;
  transform: rotate(-90deg);
}
.ring-bg   { fill: none; stroke: var(--s3); stroke-width: 3; }
.ring-prog {
  fill: none; stroke-width: 3; stroke-linecap: round;
  stroke-dasharray: 283; stroke-dashoffset: 283;
  transition: stroke-dashoffset 0.6s ease;
}
.icon-inner {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
}
.icon-inner svg {
  width: 44px; height: 44px; fill: none;
  stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 100; stroke-dashoffset: 100;
  transition: stroke-dashoffset 0.4s ease 0.55s;
}

.result-badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Unbounded', sans-serif; font-size: 9px; letter-spacing: 3px;
  text-transform: uppercase; padding: 8px 20px; border-radius: 40px; margin-bottom: 16px;
}
.badge-ok  { background: rgba(0,229,160,0.1);  border: 1px solid rgba(0,229,160,0.25);  color: var(--success); }
.badge-bad { background: rgba(255,45,107,0.1);  border: 1px solid rgba(255,45,107,0.25);  color: var(--pink); }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.7)} }

.result-label {
  font-family: 'Unbounded', sans-serif; font-size: 10px;
  letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px;
}
.result-name {
  font-family: 'Unbounded', sans-serif; font-weight: 900;
  font-size: clamp(36px, 10vw, 60px); letter-spacing: -1px; line-height: 1.05;
  color: var(--white); margin-bottom: 8px;
}
.result-sub { font-size: 14px; color: var(--muted2); line-height: 1.6; margin-bottom: 40px; }
.result-id  { font-family: 'Unbounded', sans-serif; font-size: 9px; letter-spacing: 2px; color: var(--muted); margin-bottom: 32px; }

.result-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* ── LIGHTS ── */
.lights { display: flex; gap: 10px; margin-bottom: 32px; }
.light { width: 10px; height: 10px; border-radius: 50%; animation: lightFlash 1.4s ease-in-out infinite; }
.light:nth-child(1){background:var(--lime);    animation-delay:0s;}
.light:nth-child(2){background:var(--pink);    animation-delay:0.2s;}
.light:nth-child(3){background:var(--success); animation-delay:0.4s;}
.light:nth-child(4){background:#7c3aed;        animation-delay:0.6s;}
.light:nth-child(5){background:#f59e0b;        animation-delay:0.8s;}
.light:nth-child(6){background:var(--lime);    animation-delay:1.0s;}
.light:nth-child(7){background:var(--pink);    animation-delay:1.2s;}
@keyframes lightFlash { 0%,100%{opacity:0.2;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.3)} }

.spinner { width: 32px; height: 32px; border: 2px solid var(--s3); border-top-color: var(--lime); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ═══ READY ═══ -->
<div class="screen active fadein" id="s-ready">
  <div class="wordmark">Disco<span>Pass</span></div>
  <div class="ready-icon">
    <svg width="36" height="36" fill="none" stroke="var(--lime)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/>
      <rect x="7" y="7" width="4" height="4" rx="1"/><rect x="13" y="7" width="4" height="4" rx="1"/>
      <rect x="7" y="13" width="4" height="4" rx="1"/>
    </svg>
  </div>
  <h1 class="ready-title">Door Scanner</h1>
  <p class="ready-sub">Tap below to start scanning guest QR codes at the door.</p>
  <button class="btn btn-lime" id="start-btn">Start Scanning</button>
</div>

<!-- ═══ SCANNING ═══ -->
<div class="screen" id="s-scan">
  <div class="scan-header">
    <div class="scan-header-title">Scanning…</div>
    <button class="stop-btn" id="stop-btn">Stop</button>
  </div>
  <div class="camera-area">
    <video id="cam-video" autoplay playsinline muted></video>
    <div class="finder-overlay">
      <div class="finder">
        <div class="c"></div>
        <div class="scan-line"></div>
      </div>
    </div>
    <div class="scan-hint">Point at guest's QR card</div>
  </div>
</div>

<!-- ═══ RESULT ═══ -->
<div class="screen" id="s-result">
  <div class="wordmark">Disco<span>Pass</span></div>

  <div class="result-icon" id="result-icon">
    <svg class="ring" viewBox="0 0 100 100">
      <circle class="ring-bg"   cx="50" cy="50" r="45"/>
      <circle class="ring-prog" cx="50" cy="50" r="45" id="ring-prog"/>
    </svg>
    <div class="icon-inner">
      <svg id="icon-svg" viewBox="0 0 24 24"></svg>
    </div>
  </div>

  <div class="result-badge" id="result-badge">
    <div class="badge-dot"></div>
    <span id="result-badge-text"></span>
  </div>

  <div class="result-label" id="result-label"></div>
  <div class="result-name"  id="result-name"></div>
  <div class="result-sub"   id="result-sub"></div>
  <div class="result-id"    id="result-id"></div>

  <div class="result-actions">
    <button class="btn btn-lime"    id="scan-next-btn">Scan Next Guest</button>
    <button class="btn btn-outline" id="done-btn">Done</button>
  </div>
</div>

<canvas id="qr-canvas" style="display:none"></canvas>

<script>
const SUPABASE_URL = 'https://nwzhtjfdywxdbnrcvlcx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53emh0amZkeXd4ZGJuY3J2bGN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMTY2NjIsImV4cCI6MjA5MDU5MjY2Mn0.VjZzVvl8x1y-FuUHXF5tedVWMb4phaYaRr8HQy7L5eQ';
const H = {
  'Content-Type': 'application/json', 'Accept': 'application/json',
  'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY
};

// ── DB ──
async function dbGet(id) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/passes?id=eq.${encodeURIComponent(id)}&select=*`, { headers: H });
    if (!r.ok) return null;
    const d = await r.json();
    return Array.isArray(d) && d.length ? d[0] : null;
  } catch { return null; }
}

// ── SCREEN ──
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── CAMERA ──
let stream = null, scanLoop = null, scanning = false;

document.getElementById('start-btn').addEventListener('click', startScanner);
document.getElementById('stop-btn').addEventListener('click', stopScanner);
document.getElementById('scan-next-btn').addEventListener('click', resumeScanner);
document.getElementById('done-btn').addEventListener('click', stopScanner);

async function startScanner() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const video = document.getElementById('cam-video');
    video.srcObject = stream;
    await video.play();
    show('s-scan');
    scanning = true;
    startLoop();
  } catch(e) {
    alert('Camera access denied. Please allow camera permissions in your browser settings and try again.');
  }
}

function stopScanner() {
  scanning = false;
  if (scanLoop) { clearInterval(scanLoop); scanLoop = null; }
  if (stream)   { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('cam-video').srcObject = null;
  show('s-ready');
}

function resumeScanner() {
  // Camera is still running, just go back to scan screen
  show('s-scan');
  scanning = true;
}

function startLoop() {
  const video  = document.getElementById('cam-video');
  const canvas = document.getElementById('qr-canvas');
  const ctx    = canvas.getContext('2d');
  let lastId   = '';
  let cooldown = false;

  if (scanLoop) clearInterval(scanLoop);

  scanLoop = setInterval(() => {
    if (!scanning || !video.videoWidth || video.paused) return;
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    const img  = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    if (code && code.data && !cooldown) {
      const id = extractId(code.data.trim().toUpperCase());
      if (id && id !== lastId) {
        lastId = id; cooldown = true;
        setTimeout(() => { cooldown = false; lastId = ''; }, 4000);
        scanning = false;
        handleScan(id);
      }
    }
  }, 250);
}

function extractId(raw) {
  const m = raw.match(/PASS-[A-Z0-9]{6}/);
  return m ? m[0] : null;
}

// ── HANDLE SCAN ──
async function handleScan(passId) {
  showResult({ type: 'loading', name: '', sub: '', id: passId, badge: 'Looking up…' });
  show('s-result');

  const pass = await dbGet(passId);

  if (!pass) {
    showResult({
      type: 'bad',
      name: 'Not Found',
      sub: 'This QR code is not registered. Please see event staff.',
      id: passId,
      badge: 'Invalid Pass'
    });
    return;
  }

  if (pass.status === 'locked') {
    showResult({
      type: 'bad',
      name: pass.name,
      sub: 'This pass has been deactivated. Entry not permitted.',
      id: passId,
      badge: 'Access Denied'
    });
    return;
  }

  showResult({
    type: 'ok',
    name: pass.name,
    sub: 'Welcome to the Disco! 🎉',
    id: passId,
    badge: 'Entry Granted'
  });
}

// ── SHOW RESULT ──
function showResult({ type, name, sub, id, badge }) {
  const prog    = document.getElementById('ring-prog');
  const iconSvg = document.getElementById('icon-svg');
  const badgeEl = document.getElementById('result-badge');
  const wrap    = document.getElementById('s-result');

  // Clear old animation classes
  wrap.className = 'screen active';

  if (type === 'loading') {
    prog.style.stroke = 'var(--lime)';
    iconSvg.style.stroke = 'var(--lime)';
    iconSvg.innerHTML = '';
    // Show spinner in icon area instead
    document.getElementById('icon-inner') && null;
    iconSvg.outerHTML; // no-op
    prog.style.strokeDashoffset = '283';
    badgeEl.className = 'result-badge badge-ok';
    document.getElementById('result-badge-text').textContent = badge;
    document.getElementById('result-label').textContent = '';
    document.getElementById('result-name').textContent  = '';
    document.getElementById('result-sub').textContent   = 'Verifying pass…';
    document.getElementById('result-id').textContent    = id;
    return;
  }

  const isOk = type === 'ok';
  const c    = isOk ? 'var(--success)' : 'var(--pink)';

  // Background tint
  wrap.style.background = isOk
    ? 'radial-gradient(ellipse at 50% 0%, rgba(0,229,160,0.1) 0%, transparent 55%)'
    : 'radial-gradient(ellipse at 50% 0%, rgba(255,45,107,0.1) 0%, transparent 55%)';

  // Ring animation
  prog.style.stroke = c;
  prog.style.transition = 'none';
  prog.style.strokeDashoffset = '283';
  void prog.offsetWidth;
  prog.style.transition = 'stroke-dashoffset 0.6s ease';
  prog.style.strokeDashoffset = '0';

  // Icon
  iconSvg.style.stroke = c;
  iconSvg.style.transition = 'none';
  iconSvg.style.strokeDashoffset = '100';
  if (isOk) {
    iconSvg.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
  } else {
    iconSvg.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
  }
  void iconSvg.offsetWidth;
  iconSvg.style.transition = 'stroke-dashoffset 0.4s ease 0.55s';
  iconSvg.style.strokeDashoffset = '0';

  // Badge
  badgeEl.className = 'result-badge ' + (isOk ? 'badge-ok' : 'badge-bad');
  document.getElementById('result-badge-text').textContent = badge;

  // Text
  document.getElementById('result-label').style.color = c;
  document.getElementById('result-label').textContent  = isOk ? 'Welcome,' : 'Sorry,';
  document.getElementById('result-name').textContent   = name;
  document.getElementById('result-sub').textContent    = sub;
  document.getElementById('result-id').textContent     = id;

  // Pop animation
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('result-icon').classList.add('popin');
  }));
}
</script>
</body>
</html>
